<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>无尽平衡下落</title>
<style>
body { margin:0; background:#0d1b2a; display:flex; flex-direction:column; align-items:center; font-family:sans-serif; color:#fff; }
canvas { border:2px solid #415a77; background:#1b263b; margin-top:10px; touch-action:none; }
.ui { margin:10px; text-align:center; }
button { padding:10px 20px; background:#778da9; color:white; border:none; border-radius:8px; }
#score { font-size:24px; color:#e0e1dd; }
</style>
</head>
<body>
<div class="ui">
  <h2>⚖️ 无尽平衡</h2>
  <div>距离: <span id="score">0</span>m | 最高: <span id="best">0</span></div>
  <button onclick="restart()">重新开始</button>
  <p>左右滑动/倾斜保持平衡，撑得越久越好！</p>
</div>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let player = {x:200, y:300, vx:0, size:25, angle:0};
let platforms = [];
let score = 0;
let best = localStorage.getItem('balanceBest') || 0;
let gameOver = false;
let speed = 2;
let mouseX = 200;

function spawnPlatforms() {
  platforms = [];
  for (let i = 0; i < 8; i++) {
    platforms.push({
      x: 50 + Math.random()*300,
      y: 500 - i*80,
      w: 80 + Math.random()*60,
      h: 12,
      speed: (Math.random()-0.5)*1.5
    });
  }
}

function update() {
  if (gameOver) return;

  // Player control
  player.vx += (mouseX - 200) * 0.01;
  player.vx *= 0.95;
  player.x += player.vx;
  player.angle = player.vx * 0.1;

  // Bounds
  if (player.x < 20) { player.x = 20; player.vx = 0; }
  if (player.x > 380) { player.x = 380; player.vx = 0; }

  // Platforms move up
  for (let p of platforms) {
    p.y -= speed;
    p.x += p.speed;
    if (p.x < 10 || p.x + p.w > 390) p.speed *= -1;

    // Collision
    if (player.y + player.size > p.y && player.y < p.y + 30 &&
        player.x > p.x - 10 && player.x < p.x + p.w + 10) {
      player.y = p.y - player.size;
      player.vx += p.speed * 0.3;
      score += 0.1;
    }
  }

  // Gravity
  player.y += 1.5;
  if (player.y > 550) gameOver = true;

  // Recycle platforms
  platforms = platforms.filter(p => p.y > -50);
  if (platforms.length < 6) {
    platforms.push({
      x: 30 + Math.random()*300,
      y: -20,
      w: 70 + Math.random()*80,
      h: 12,
      speed: (Math.random()-0.5)*2
    });
  }

  speed = 2 + score * 0.02;
  document.getElementById('score').textContent = Math.floor(score);
  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('balanceBest', best);
    document.getElementById('best').textContent = best;
  }
}

function draw() {
  ctx.fillStyle = '#1b263b';
  ctx.fillRect(0,0,400,600);

  // Platforms
  for (let p of platforms) {
    ctx.fillStyle = '#778da9';
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }

  // Player
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);
  ctx.fillStyle = '#e0e1dd';
  ctx.beginPath();
  ctx.arc(0, 0, player.size/2, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,220,400,160);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('掉下去了！', 200, 280);
    ctx.font = '18px sans-serif';
    ctx.fillText(Math.floor(score) + ' 米', 200, 320);
  }
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseX = e.touches[0].clientX - rect.left;
}, {passive:false});

function restart() {
  player = {x:200, y:250, vx:0, size:25, angle:0};
  score = 0;
  gameOver = false;
  speed = 2;
  spawnPlatforms();
  document.getElementById('score').textContent = 0;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('best').textContent = best;
restart();
loop();
</script>
</body>
</html>
