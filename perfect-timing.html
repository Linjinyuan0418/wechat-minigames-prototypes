<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>刚好 · 一键时机</title>
<style>
body {
  margin: 0;
  background: linear-gradient(160deg, #a8edea 0%, #fed6e3 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #333;
  min-height: 100vh;
}
canvas {
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  background: #fff;
  margin-top: 12px;
  touch-action: none;
}
.ui {
  margin: 16px 12px 8px;
  text-align: center;
}
h2 {
  margin: 0 0 6px;
  font-weight: 600;
  color: #ff6b9d;
}
#score {
  font-size: 28px;
  font-weight: 700;
  color: #ff6b9d;
}
#best {
  font-size: 16px;
  color: #888;
}
button {
  margin-top: 8px;
  padding: 10px 24px;
  background: #ff6b9d;
  color: white;
  border: none;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
button:active { transform: scale(0.96); }
.tip {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
  max-width: 340px;
}
</style>
</head>
<body>
<div class="ui">
  <h2>刚好</h2>
  <div>分数 <span id="score">0</span></div>
  <div id="best">最高 0</div>
  <button onclick="restart()">再来一局</button>
  <div class="tip">按住蓄力，松开跳跃。落在平台中心有完美加分～</div>
</div>
<canvas id="game" width="360" height="520"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 360, H = 520;

let player = { x: 80, y: 300, vy: 0, onGround: true, charging: false, charge: 0 };
let platforms = [];
let score = 0;
let best = parseInt(localStorage.getItem('perfectBest') || 0);
let gameOver = false;
let cameraX = 0;
let particles = [];
let perfectFlash = 0;

function initPlatforms() {
  platforms = [];
  let x = 40;
  for (let i = 0; i < 8; i++) {
    const w = 70 + Math.random() * 40;
    platforms.push({
      x: x,
      y: 380 - Math.random() * 40,
      w: w,
      h: 14,
      perfect: w * 0.28
    });
    x += w + 50 + Math.random() * 40;
  }
}

function spawnParticle(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: -Math.random() * 4 - 1,
      life: 30,
      color
    });
  }
}

function update() {
  if (gameOver) return;

  if (player.charging && player.onGround) {
    player.charge = Math.min(player.charge + 0.8, 28);
  }

  if (!player.onGround) {
    player.vy += 0.45;
    player.y += player.vy;
    player.x += 3.2;
  }

  let landed = false;
  for (let p of platforms) {
    if (player.vy > 0 &&
        player.y + 18 > p.y && player.y + 18 < p.y + 20 &&
        player.x > p.x - 10 && player.x < p.x + p.w + 10) {
      player.y = p.y - 18;
      player.vy = 0;
      player.onGround = true;
      landed = true;

      const center = p.x + p.w / 2;
      const dist = Math.abs(player.x - center);
      if (dist < p.perfect) {
        score += 15;
        perfectFlash = 12;
        spawnParticle(player.x, player.y, '#ff6b9d');
      } else {
        score += 5;
        spawnParticle(player.x, player.y, '#a8edea');
      }
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('perfectBest', best);
        document.getElementById('best').textContent = '最高 ' + best;
      }
      break;
    }
  }

  if (!landed && player.y > 460) {
    gameOver = true;
  }

  cameraX = player.x - 100;

  platforms = platforms.filter(p => p.x + p.w > cameraX - 50);
  while (platforms.length < 7) {
    const last = platforms[platforms.length - 1];
    const w = 60 + Math.random() * 50;
    platforms.push({
      x: last.x + last.w + 45 + Math.random() * 50,
      y: 360 + Math.random() * 50,
      w: w,
      h: 14,
      perfect: w * 0.26
    });
  }

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);

  if (perfectFlash > 0) perfectFlash--;
}

function draw() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#e0f7fa');
  grad.addColorStop(1, '#fff5f8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-cameraX, 0);

  platforms.forEach(p => {
    ctx.fillStyle = 'rgba(255,107,157,0.15)';
    ctx.fillRect(p.x + p.w/2 - p.perfect, p.y - 4, p.perfect * 2, 6);

    ctx.fillStyle = '#ff8fab';
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.w, p.h, 8);
    ctx.fill();
  });

  ctx.fillStyle = perfectFlash > 0 ? '#ff6b9d' : '#5e60ce';
  ctx.beginPath();
  ctx.arc(player.x, player.y, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(player.x - 5, player.y - 3, 3, 0, Math.PI * 2);
  ctx.arc(player.x + 5, player.y - 3, 3, 0, Math.PI * 2);
  ctx.fill();

  if (player.charging && player.onGround) {
    ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 20 + player.charge * 0.4, 0, Math.PI * 2);
    ctx.stroke();
  }

  particles.forEach(p => {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.restore();

  if (gameOver) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(40, 180, 280, 140);
    ctx.fillStyle = '#ff6b9d';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('掉下去啦', W/2, 230);
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#555';
    ctx.fillText('分数 ' + score, W/2, 265);
  }
}

function jump() {
  if (!player.onGround || gameOver) return;
  const power = 8 + player.charge * 0.35;
  player.vy = -power;
  player.onGround = false;
  player.charging = false;
  player.charge = 0;
}

let pressing = false;
canvas.addEventListener('mousedown', () => { pressing = true; if (player.onGround) player.charging = true; });
canvas.addEventListener('mouseup', () => { if (pressing) jump(); pressing = false; });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  pressing = true;
  if (player.onGround) player.charging = true;
}, {passive: false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (pressing) jump();
  pressing = false;
});

function restart() {
  player = { x: 80, y: 300, vy: 0, onGround: true, charging: false, charge: 0 };
  score = 0;
  gameOver = false;
  cameraX = 0;
  particles = [];
  perfectFlash = 0;
  document.getElementById('score').textContent = 0;
  initPlatforms();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('best').textContent = '最高 ' + best;
initPlatforms();
loop();
</script>
</body>
</html>
