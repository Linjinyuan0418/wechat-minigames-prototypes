<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>精准拆除 · 拆到刚好</title>
<style>
body { margin:0; background:#16213e; display:flex; flex-direction:column; align-items:center; font-family:sans-serif; color:#fff; }
canvas { border:2px solid #0f3460; background:#1a1a2e; margin-top:10px; cursor:pointer; }
.ui { margin:10px; text-align:center; }
button { padding:10px 20px; margin:5px; background:#e94560; color:white; border:none; border-radius:8px; }
#score { font-size:22px; color:#ffd93d; }
</style>
</head>
<body>
<div class="ui">
  <h2>🐱 拆了这座塔</h2>
  <div>拆除数: <span id="score">0</span> | 最高: <span id="best">0</span></div>
  <button onclick="restart()">重新开始</button>
  <p>点击方块拆除，保持小猫安全！拆错会塌～</p>
</div>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let blocks = [];
let cat = {x:200, y:100, size:30};
let score = 0;
let best = localStorage.getItem('demoBest') || 0;
let gameOver = false;

function createTower() {
  blocks = [];
  for (let row = 0; row < 12; row++) {
    for (let col = 0; col < 5; col++) {
      if (Math.random() > 0.15) {
        blocks.push({
          x: 80 + col * 50,
          y: 480 - row * 35,
          w: 45, h: 30,
          color: `hsl(${Math.random()*60+20}, 70%, 50%)`,
          id: row*5+col
        });
      }
    }
  }
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0,0,400,600);

  // Ground
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 520, 400, 80);

  // Blocks
  for (let b of blocks) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#333';
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  // Cat
  ctx.fillStyle = '#ff9f1c';
  ctx.beginPath();
  ctx.arc(cat.x, cat.y, cat.size/2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cat.x-8, cat.y-5, 4, 0, Math.PI*2);
  ctx.arc(cat.x+8, cat.y-5, 4, 0, Math.PI*2);
  ctx.fill();
  // Ears
  ctx.fillStyle = '#ff9f1c';
  ctx.beginPath();
  ctx.moveTo(cat.x-15, cat.y-10);
  ctx.lineTo(cat.x-5, cat.y-25);
  ctx.lineTo(cat.x, cat.y-10);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cat.x+15, cat.y-10);
  ctx.lineTo(cat.x+5, cat.y-25);
  ctx.lineTo(cat.x, cat.y-10);
  ctx.fill();

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0,200,400,200);
    ctx.fillStyle = '#fff';
    ctx.font = '30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(score > 5 ? '塔塌了！' : '小猫掉了！', 200, 280);
    ctx.font = '18px sans-serif';
    ctx.fillText('拆除了 ' + score + ' 块', 200, 320);
  }
}

function checkSupport() {
  // Simple: if no block under cat roughly
  let supported = false;
  for (let b of blocks) {
    if (Math.abs(b.x + b.w/2 - cat.x) < 40 && cat.y + 20 > b.y && cat.y < b.y + 50) {
      supported = true;
      break;
    }
  }
  if (!supported && cat.y < 500) {
    cat.y += 8;
    if (cat.y > 500) gameOver = true;
  }
}

canvas.addEventListener('click', e => {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  for (let i = blocks.length-1; i >= 0; i--) {
    const b = blocks[i];
    if (mx > b.x && mx < b.x+b.w && my > b.y && my < b.y+b.h) {
      blocks.splice(i, 1);
      score++;
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('demoBest', best);
        document.getElementById('best').textContent = best;
      }
      // Move cat slightly
      cat.x += (Math.random()-0.5)*10;
      break;
    }
  }
  checkSupport();
});

function restart() {
  createTower();
  score = 0;
  gameOver = false;
  cat = {x:200, y:120, size:30};
  document.getElementById('score').textContent = 0;
}

function loop() {
  if (!gameOver) checkSupport();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('best').textContent = best;
restart();
loop();
</script>
</body>
</html>
